name: Build APK Collecteur (cloud)

# Build l'APK release de l'app COLLECTEUR sur les serveurs GitHub (zéro charge
# sur ton PC) puis le publie sur les Releases de CE dépôt → lien de
# téléchargement pour les collecteurs/testeurs.
#
# Publication sur les Releases du dépôt lui-même via le GITHUB_TOKEN
# automatique → AUCUN secret à configurer, ça marche dès le 1er push.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Tag de la release (laisser vide = 'latest')"
        required: false
        default: ""

permissions:
  contents: write          # créer la Release + y attacher l'APK

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Flutter 3.44.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: stable
          cache: true

      # Le cloud a besoin de télécharger les dépendances Gradle + de plus de
      # mémoire. On ajuste UNIQUEMENT la copie du runner (pas ton fichier local).
      - name: Adapter gradle.properties pour le cloud
        run: |
          sed -i 's/org.gradle.offline=true/org.gradle.offline=false/' android/gradle.properties
          sed -i 's/-Xmx2g -XX:MaxMetaspaceSize=512m/-Xmx4g -XX:MaxMetaspaceSize=1g/' android/gradle.properties

      # Restaure la signature release SI le bundle chiffré existe (secret
      # SIGNING_PASSPHRASE). Sinon → signature debug : l'APK se construit quand
      # même, les testeurs désinstallent l'ancienne version une fois.
      - name: Restaurer la signature release (si présente)
        env:
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
        run: |
          if [ -n "$SIGNING_PASSPHRASE" ] && [ -f android/signing.tar.enc ]; then
            mkdir -p /tmp/sign
            if ! openssl enc -d -aes-256-cbc -pbkdf2 -pass pass:"$SIGNING_PASSPHRASE" -in android/signing.tar.enc | tar -xf - -C /tmp/sign; then
              echo "❌ Déchiffrement impossible → vérifie le secret SIGNING_PASSPHRASE."
              exit 1
            fi
            mv /tmp/sign/*.jks android/app/ 2>/dev/null || true
            mv /tmp/sign/key.properties android/key.properties 2>/dev/null || true
            echo "✅ Signature release configurée."
          else
            echo "ℹ️ Pas de signature chiffrée → build en signature debug."
          fi

      - name: Dépendances Flutter
        run: flutter pub get

      # --split-per-abi : un APK par architecture → l'APK arm64 (99 % des
      # téléphones) est nettement plus léger.
      - name: Build APK (séparé par ABI)
        run: flutter build apk --release --split-per-abi

      - name: Renommer l'APK arm64
        run: cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk TontineBeninCollecteur.apk

      - name: Taille de l'APK
        run: ls -lh TontineBeninCollecteur.apk

      - name: Publier l'APK sur les Releases de ce dépôt
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || 'latest' }}
          name: TontineBénin Collecteur ${{ inputs.version || 'latest' }}
          files: TontineBeninCollecteur.apk
          fail_on_unmatched_files: true
